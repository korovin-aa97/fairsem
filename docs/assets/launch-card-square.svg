<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
  <title id="title">Five workers, two safe slots, one Linux machine</title>
  <desc id="description">FairSem keeps two jobs running while three older-first waiters remain visible.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a19"/>
      <stop offset="0.58" stop-color="#0b2d28"/>
      <stop offset="1" stop-color="#0d3b31"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#030712" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" rx="44" fill="url(#background)"/>
  <circle cx="930" cy="80" r="260" fill="#34d399" opacity="0.10"/>
  <circle cx="1040" cy="1010" r="330" fill="#2dd4bf" opacity="0.08"/>

  <text x="76" y="104" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">OPEN SOURCE · LINUX · ZERO TELEMETRY</text>
  <text x="76" y="226" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="94" font-weight="800" letter-spacing="-3">FairSem</text>
  <text x="76" y="306" fill="#d5deef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="750">Five workers. Two safe slots.</text>
  <text x="76" y="360" fill="#9fb1c9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30">One visible, oldest-first queue.</text>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="76" y="444" width="928" height="418" rx="30" fill="#102f2b" stroke="#34d399" stroke-width="3"/>

    <text x="116" y="500" fill="#a7f3d0" font-size="21" font-weight="700" letter-spacing="1.5">FAIRSEM STATUS · DEMO</text>
    <text x="116" y="548" fill="#f0fdfa" font-size="28" font-weight="700">slots=2 · in_use=2 · waiting=3</text>

    <rect x="116" y="590" width="390" height="92" rx="20" fill="#174a40" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="152" cy="636" r="11" fill="#34d399"/>
    <text x="180" y="646" fill="#f0fdfa" font-size="27" font-weight="700">job 1 running</text>
    <rect x="526" y="590" width="390" height="92" rx="20" fill="#174a40" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="562" cy="636" r="11" fill="#6ee7b7"/>
    <text x="590" y="646" fill="#f0fdf4" font-size="27" font-weight="700">job 2 running</text>

    <rect x="116" y="712" width="244" height="88" rx="18" fill="#246b5b"/>
    <text x="144" y="749" fill="#d1fae5" font-size="18" font-weight="700">OLDEST WAITER</text>
    <text x="144" y="781" fill="#ffffff" font-size="25" font-weight="700">job 3</text>
    <path d="M366 756 H406" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
    <path d="M394 742 L410 756 L394 770" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="420" y="712" width="224" height="88" rx="18" fill="#1e584c"/>
    <text x="448" y="749" fill="#b9f6df" font-size="18" font-weight="700">NEXT</text>
    <text x="448" y="781" fill="#ecfdf5" font-size="25" font-weight="700">job 4</text>
    <rect x="664" y="712" width="252" height="88" rx="18" fill="#17453c"/>
    <text x="692" y="749" fill="#9fb1c9" font-size="18" font-weight="700">WAITING SAFELY</text>
    <text x="692" y="781" fill="#d5deef" font-size="25" font-weight="700">job 5</text>
  </g>

  <text x="76" y="942" fill="#d1fae5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">No daemon · visible status · fail-closed by default</text>
  <text x="76" y="994" fill="#8da6bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">github.com/korovin-aa97/fairsem</text>
</svg>
